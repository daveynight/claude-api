[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-api-tools"
version = "0.1.0"
description = "Reusable Claude API tooling from the Anthropic Academy course repo"
requires-python = ">=3.10"
dependencies = ["anthropic"]

[tool.setuptools]
py-modules = ["tool_schemas", "prompt_evaluator"]
